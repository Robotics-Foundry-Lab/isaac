services:
  isaac_ros:
    build:
      context: ..                # build context is parent folder
      dockerfile: .devcontainer/Dockerfile
      args:
        WORKSPACE: ${WORKSPACE:-/workspace}
    runtime: nvidia
    container_name: isaac_ros
    network_mode: host
    privileged: true
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    init: true # forwards docker stop to ros2 launch and reaps zombie processes
    environment:
      # Override per run, e.g.: USE_NVBLOX=false USE_NAVIGATION=false docker compose up
      USE_VSLAM: ${USE_VSLAM:-true} # true / false: Isaac ROS visual SLAM
      USE_NVBLOX: ${USE_NVBLOX:-true} # true / false: NVBLOX 3D reconstruction and costmap
      USE_NAVIGATION: ${USE_NAVIGATION:-true} # true / false: slam_toolbox + EKF + Nav2
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      PULSE_SERVER: ${PULSE_SERVER}
      LIBGL_ALWAYS_SOFTWARE: "1"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
    volumes:
      - /dev/input:/dev/input # This is only required to recognise the joystick if it is turned on after the container started
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - ../:/workspace:cached

    command: ["bash", "/workspace/entrypoint.sh"]
