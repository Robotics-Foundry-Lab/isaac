ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 1.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /visual_slam/tracking/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]
                   
    odom0_twist_rejection_threshold: 2.0
    odom0_queue_size: 10

    imu0: /camera/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true, true, true,
                  false, false, false]
    imu0_queue_size: 10
