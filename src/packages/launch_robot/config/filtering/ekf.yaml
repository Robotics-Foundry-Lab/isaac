ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 1.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_wheel
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
                   
    odom0_queue_size: 10
    
    imu0: /camera0/gyro/sample
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10

    odom1: /visual_slam/tracking/odometry
    odom1_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]
                   
    odom1_twist_rejection_threshold: 2.0 # This can be used to reject outliers. If you see jumps in the pose of the robot you may reduce this threshold that it will filter them more aggressively. 
    odom1_queue_size: 10
